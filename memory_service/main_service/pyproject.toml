[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "main-service"
version = "1.0.0"
description = "Main API 服务"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "TuLing AI Team"}
]

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",

    # 数据库
    "sqlalchemy>=2.0.49",
    "psycopg[binary]>=3.2.3",

    # HTTP 客户端
    "httpx>=0.27.2",

    # 工具
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",

    # 记忆服务
    "memory-service @ file:///${PROJECT_ROOT}/../memory_service",
    "langgraph-checkpoint-postgres>=2.0.6",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*", "db*"]
exclude = ["tests*", "docs*", ".venv*"]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
memory-service = { path = "../memory_service", editable = true }
