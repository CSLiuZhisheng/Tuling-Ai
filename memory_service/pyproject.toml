[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-service"
version = "2.0.0"
description = "统一的长期记忆管理服务"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "TuLing AI Team"}
]
keywords = ["memory", "langgraph", "langchain", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0.6",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.9",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.29.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/tuling-ai/memory-service"
Documentation = "https://github.com/tuling-ai/memory-service/blob/main/README.md"
Repository = "https://github.com/tuling-ai/memory-service"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_service*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
memory_service = ["*.md", "*.txt"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
